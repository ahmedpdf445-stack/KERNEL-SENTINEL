[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-sentinel"
version = "0.1.0"
description = "Python-first simulated process-behavior anomaly research platform"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
kernel-sentinel = "kernel_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

